name: Build macOS installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-macos.yml'
      - 'electron/**'
      - 'functions/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.gitignore'
      - 'public/desktop-updates/macos.*'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          if [ -e .env ]; then
            echo "::error::.env must not be present in the repository. Remove it and rotate any credentials it contained."
            exit 1
          fi
          for file in electron/main.cjs functions/index.js package-lock.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Required project file is missing: $file. Commit and push the complete desktop source first."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installers
        run: npm run desktop:pack:mac

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zyro-management-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish installers to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning::Set the repository secret FIREBASE_TOKEN to publish desktop installers to Firebase Hosting."
            exit 0
          fi

          mkdir -p public/desktop-updates/macos
          curl --fail --silent --show-error \
            https://zyro-78855.web.app/desktop-updates/latest.yml \
            --output public/desktop-updates/latest.yml
          windows_installer="$(awk '/^  - url: / { print $3; exit }' public/desktop-updates/latest.yml)"
          if [ -z "$windows_installer" ]; then
            echo "::error::Could not determine the current Windows installer from the cloud manifest."
            exit 1
          fi
          for file in "$windows_installer" "$windows_installer.blockmap"; do
            curl --fail --silent --show-error \
              "https://zyro-78855.web.app/desktop-updates/$file" \
              --output "public/desktop-updates/$file"
          done

          cp release/*.dmg public/desktop-updates/macos/
          node <<'NODE'
          const fs = require('node:fs')
          const version = require('./package.json').version
          const architectures = [
            { arch: 'arm64', label: 'Apple Silicon (M1, M2, M3 oder neuer)' },
            { arch: 'x64', label: 'Intel-Mac' },
          ]
          const files = architectures.map(({ arch, label }) => {
            const name = `Zyro-Management-${version}-${arch}.dmg`
            if (!fs.existsSync(`public/desktop-updates/macos/${name}`)) {
              throw new Error(`Missing macOS installer: ${name}`)
            }
            return { name, label }
          })
          fs.writeFileSync(
            'public/desktop-updates/macos/latest.json',
            JSON.stringify({ version, files }),
          )
          NODE

          npm run build:web
          npm install --global firebase-tools
          firebase deploy --only hosting --project zyro-78855 --non-interactive
